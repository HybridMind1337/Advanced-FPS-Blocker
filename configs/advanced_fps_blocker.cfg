// Advanced FPS Blocker v1.2.0 | HybridMind
// Execute from amxx.cfg using:
// exec addons/amxmodx/configs/advanced_fps_blocker.cfg

afb_enabled "1"
afb_max_fps "100"
afb_fps_interval "3.0"
afb_map_grace "15.0"
afb_join_grace "15.0"

// Diagnostic test: client setinfo command followed by server readback.
// A mismatch DOES NOT prove cl_filterstuffcmd 1.
afb_filter_enabled "1"
afb_filter_interval "15.0"
afb_filter_wait "3.0"
afb_filter_failures "3"
// Set to 1 ONLY if you explicitly want clients kicked for failed verification.
afb_filter_kick "0"
afb_public_kicks "1"

afb_fps_notify "1"
afb_fps_notify_interval "30.0"
afb_log "1"

// HNS: request developer 0 if a client reports another value.
// Checks are non-punitive and don't block player movement.
afb_developer_check "1"
afb_developer_interval "8.0"
afb_developer_notify_interval "30.0"
